x-service: &service
  restart: unless-stopped
  mem_limit: 192m
  environment: &service-env
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
    DB_POOL_SIZE: "5"
    UPSTREAM_TIMEOUT: "3"
  depends_on: &service-deps
    otel-collector:
      condition: service_started
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    user: "0:0" # lets the file exporter write to the bind-mounted ./data/telemetry
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./data/telemetry:/data/telemetry
    ports:
      - "4318:4318"

  gateway:
    <<: *service
    build: { context: ./services, args: { SERVICE: gateway } }
    environment:
      <<: *service-env
      ORDERS_URL: http://orders:8000
      INVENTORY_URL: http://inventory:8000
    ports: ["8080:8000"]

  orders:
    <<: *service
    build: { context: ./services, args: { SERVICE: orders } }
    environment:
      <<: *service-env
      INVENTORY_URL: http://inventory:8000
      PAYMENTS_URL: http://payments:8000
      NOTIFICATIONS_URL: http://notifications:8000
    depends_on:
      <<: *service-deps
      postgres: { condition: service_healthy }
    ports: ["8081:8000"]

  inventory:
    <<: *service
    build: { context: ./services, args: { SERVICE: inventory } }
    depends_on:
      <<: *service-deps
      postgres: { condition: service_healthy }
    ports: ["8082:8000"]

  payments:
    <<: *service
    build: { context: ./services, args: { SERVICE: payments } }
    depends_on:
      <<: *service-deps
      postgres: { condition: service_healthy }
    ports: ["8083:8000"]

  notifications:
    <<: *service
    build: { context: ./services, args: { SERVICE: notifications } }
    ports: ["8084:8000"]

  loadgen:
    build: ./loadgen
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://gateway:8000
      RATE: "5"
    depends_on:
      gateway: { condition: service_healthy }

  # The investigator: ingests the collector's files into Postgres, serves the API and dashboard.
  # Open http://localhost:8000. Fix verification needs Docker, so for sandboxed remediation run
  # `python -m rootcause serve` on the host instead (see README).
  rootcause:
    build:
      context: .
      dockerfile: Dockerfile.rootcause
    restart: unless-stopped
    environment:
      ROOTCAUSE_DB: postgresql+psycopg2://shop:shop@postgres:5432/shop
      TELEMETRY_DIR: /data/telemetry
      ROOTCAUSE_WATCH: "1"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./data/telemetry:/data/telemetry:ro
    depends_on:
      postgres: { condition: service_healthy }
      otel-collector: { condition: service_started }
    ports: ["8000:8000"]
